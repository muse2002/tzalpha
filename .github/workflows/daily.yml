name: 매일 수집

on:
  schedule:
    - cron: '30 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 및 뷰어 생성
        run: python run_daily.py

      - name: 결과 커밋
        run: |
          git config user.name  "tzalpha-bot"
          git config user.email "actions@github.com"
          git add data/ viewer.html
          if git diff --staged --quiet; then
            echo "변경 없음. 커밋 건너뜀."
          else
            git commit -m "자동수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: 공개할 파일 모으기
        run: |
          mkdir -p _site
          cp viewer.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
