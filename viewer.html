<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시차 알파 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0B0E1A; --deep:#131A2C; --card:#172035; --edge:#263252;
  --paper:#E2E8F5; --mute:#7E8AA8; --dawn:#F5B942;
  --up:#FF5C5C; --down:#4D96FF; --flat:#5C6784;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--paper);font-family:var(--sans);
  font-size:14px;line-height:1.55;letter-spacing:-0.01em;padding:0 0 90px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{border-bottom:1px solid var(--edge);background:linear-gradient(180deg,#0E1424,var(--void));padding:24px 0 0}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:25px;font-weight:800;letter-spacing:-0.04em}
.brand .sub{color:var(--mute);font-size:12.5px;letter-spacing:0}
.refresh{margin-left:auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.stamp{color:var(--mute);font-size:11px;font-family:var(--mono);text-align:right;line-height:1.5}
.stamp .stale{color:var(--dawn)}
button.act{background:var(--dawn);color:#221A05;border:none;border-radius:7px;
  font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:-0.01em;
  padding:9px 17px;cursor:pointer;transition:opacity .15s;white-space:nowrap}
button.act:hover{opacity:.85}
button.act:disabled{opacity:.45;cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(34,26,5,.3);
  border-top-color:#221A05;border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:-1px;margin-right:6px}

.strip{margin:20px 0 0;position:relative;height:54px}
.strip svg{width:100%;height:100%;display:block;overflow:visible}
.strip-label{position:absolute;bottom:-2px;font-size:10.5px;color:var(--mute);
  font-family:var(--mono);transform:translateX(-50%);white-space:nowrap}
.strip-label.hot{color:var(--dawn)}

nav{display:flex;gap:2px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--mute);
  font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:-0.01em;
  padding:10px 15px;cursor:pointer;white-space:nowrap;transition:color .15s}
nav button:hover{color:var(--paper)}
nav button[aria-selected="true"]{color:var(--dawn);border-bottom-color:var(--dawn)}

main{padding-top:24px}
.panel[hidden]{display:none}
h2{font-size:15px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px}
h3{font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--mute);margin:0 0 7px}
.hint{color:var(--mute);font-size:12.5px;margin-bottom:16px}

.card{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(370px,1fr))}

.sigcard .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.sigcard .id{font-family:var(--mono);font-size:11px;color:var(--mute)}
.sigcard .nm{font-weight:700;font-size:14.5px;letter-spacing:-0.02em;margin-top:1px}
.badge{font-weight:800;font-size:15px;padding:6px 15px;border-radius:7px;
  letter-spacing:-0.01em;margin-left:auto;white-space:nowrap}
.b-long{background:rgba(255,92,92,.15);color:var(--up);border:1px solid rgba(255,92,92,.35)}
.b-short{background:rgba(77,150,255,.15);color:var(--down);border:1px solid rgba(77,150,255,.35)}
.b-none{background:rgba(92,103,132,.15);color:var(--flat);border:1px solid rgba(92,103,132,.35)}
.plan{font-family:var(--mono);font-size:11.5px;color:var(--mute);
  background:var(--deep);border-radius:6px;padding:8px 11px;margin-bottom:14px}
.sec{border-top:1px solid var(--edge);padding-top:12px;margin-top:12px}
.sec p{font-size:12.8px;line-height:1.72;color:#CBD3E4}
.sec p b{color:var(--paper)}
.sec .why{color:var(--dawn)}
.decomp{display:flex;gap:8px;margin:9px 0 7px;font-family:var(--mono);font-size:11px}
.decomp div{flex:1;background:var(--deep);border-radius:6px;padding:7px 9px;border:1px solid var(--edge)}
.decomp .k{color:var(--mute);font-size:10px;display:block;margin-bottom:2px}
.mini{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:6px;line-height:1.55}
.evt{background:rgba(245,185,66,.07);border-left:2px solid var(--dawn);
  padding:9px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:12.3px;line-height:1.6}
.evt .t{font-weight:700;color:var(--dawn)}

.warn{border-left:3px solid var(--dawn);background:rgba(245,185,66,.07);
  padding:13px 16px;border-radius:0 8px 8px 0;margin-bottom:16px;font-size:12.5px;line-height:1.65}
.warn b{color:var(--dawn)}
.warn.danger{border-left-color:var(--up);background:rgba(255,92,92,.07)}
.warn.danger b{color:var(--up)}
.warn.ok{border-left-color:var(--down);background:rgba(77,150,255,.07)}
.warn.ok b{color:var(--down)}

.tablewrap{overflow-x:auto;border:1px solid var(--edge);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:740px}
th{background:var(--deep);color:var(--mute);font-weight:600;font-size:10.5px;
  text-align:right;padding:9px 12px;border-bottom:1px solid var(--edge);
  white-space:nowrap;letter-spacing:0.03em}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{padding:9px 12px;border-bottom:1px solid rgba(38,50,82,.5);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:rgba(38,50,82,.35)}
tbody tr.dim td{color:var(--flat)}
.tag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:4px;
  border:1px solid var(--edge);color:var(--mute);margin-left:5px;vertical-align:1px}
.tag.stop{border-color:rgba(255,92,92,.4);color:var(--up)}
.tag.ref{border-color:rgba(245,185,66,.4);color:var(--dawn)}
.tag.sector{border-color:rgba(77,150,255,.4);color:var(--down)}
.pos{color:var(--up)} .neg{color:var(--down)} .zero{color:var(--flat)}
.bar{display:inline-block;height:4px;border-radius:2px;background:var(--dawn);vertical-align:2px;margin-right:7px}

details{border:1px solid var(--edge);border-radius:9px;margin-bottom:16px;background:var(--card)}
summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+ ';color:var(--dawn);font-family:var(--mono)}
details[open] summary::before{content:'- '}
details[open] summary{color:var(--paper);border-bottom:1px solid var(--edge)}
.gloss{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.gloss dt{font-family:var(--mono);font-size:11.5px;color:var(--dawn);margin-bottom:3px}
.gloss dd{font-size:12.3px;color:#BEC7DC;line-height:1.62}

select{background:var(--deep);color:var(--paper);border:1px solid var(--edge);border-radius:7px;
  padding:9px 12px;font-family:var(--sans);font-size:13px;min-width:270px;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:9px;margin:13px 0 0}
.stat{background:var(--deep);border:1px solid var(--edge);border-radius:8px;padding:10px 12px}
.stat .k{font-size:10.5px;color:var(--mute)}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-0.02em}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.slider label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-bottom:5px}
.slider label span{font-family:var(--mono);color:var(--paper)}
input[type=range]{width:100%;accent-color:var(--dawn)}
.chart{background:var(--deep);border:1px solid var(--edge);border-radius:10px;padding:14px}
.chart svg{width:100%;height:220px;display:block}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:660px){.split{grid-template-columns:1fr}.brand h1{font-size:21px}
  .refresh{margin-left:0;width:100%;justify-content:space-between}}
.note{font-size:12px;color:var(--mute);line-height:1.7;margin-top:9px;white-space:pre-wrap}
.empty{color:var(--flat);font-size:12.5px;padding:26px;text-align:center;line-height:1.85}
code{font-family:var(--mono);font-size:11.5px;background:var(--deep);padding:2px 6px;border-radius:4px;color:var(--dawn)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>시차 알파 콘솔</h1>
      <span class="sub">미국 종가 → 국내 시가, 그 사이 4시간</span>
      <div class="refresh">
        <div class="stamp" id="stamp"></div>
        <button class="act" id="btn-refresh">데이터 갱신</button>
      </div>
    </div>

    <div class="strip">
      <svg viewBox="0 0 1000 44" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="gapg" x1="0" x2="1">
          <stop offset="0%" stop-color="#F5B942" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#F5B942" stop-opacity="0.05"/></linearGradient></defs>
        <rect x="0" y="15" width="1000" height="9" fill="#131A2C" rx="4.5"/>
        <rect x="979" y="15" width="21" height="9" fill="#263252" rx="4.5"/>
        <rect x="0" y="15" width="208" height="9" fill="#263252" rx="4.5"/>
        <rect x="208" y="15" width="167" height="9" fill="url(#gapg)"/>
        <rect x="375" y="15" width="271" height="9" fill="#3A4670" rx="4.5"/>
        <line id="nowline" x1="0" y1="7" x2="0" y2="32" stroke="#E2E8F5" stroke-width="1.5"/>
        <circle id="nowdot" cx="0" cy="7" r="3" fill="#E2E8F5"/>
      </svg>
      <div class="strip-label hot" style="left:20.8%">05:00 미국 마감</div>
      <div class="strip-label" style="left:37.5%">09:00 국장 개장</div>
      <div class="strip-label" style="left:64.6%">15:30 마감</div>
    </div>

    <nav role="tablist">
      <button role="tab" aria-selected="true" data-t="today">오늘의 신호</button>
      <button role="tab" aria-selected="false" data-t="rank">모델 순위</button>
      <button role="tab" aria-selected="false" data-t="detail">모델 상세</button>
      <button role="tab" aria-selected="false" data-t="data">데이터 현황</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-today">
    <div id="refresh-msg"></div>
    <h2>간밤의 미국 시장</h2>
    <p class="hint">각 종목의 움직임을 <b>섹터 몫</b>과 <b>개별 몫</b>으로 쪼개서 보여줍니다. 이 구분이 핵심입니다.</p>
    <div id="board"></div>

    <h2 style="margin-top:28px">오늘의 신호</h2>
    <p class="hint">결과가 나오기 <b>전에</b> 기록된 예측입니다. 이 기록만이 나중에 증거가 됩니다.</p>
    <div id="today-body"></div>
  </section>

  <section class="panel" id="p-rank" hidden>
    <h2>모델 순위</h2>
    <p class="hint">행을 누르면 상세로 이동합니다.</p>
    <details><summary>표의 항목이 무슨 뜻인가요?</summary><dl class="gloss" id="gloss"></dl></details>
    <div id="noise-banner"></div>
    <div class="tablewrap"><table id="rank-table"></table></div>
  </section>

  <section class="panel" id="p-detail" hidden>
    <h2 style="margin-bottom:9px">모델 상세</h2>
    <select id="msel"></select>
    <div id="detail-body" style="margin-top:14px"></div>
  </section>

  <section class="panel" id="p-data" hidden>
    <h2>데이터 현황</h2>
    <p class="hint">수집이 끊기면 여기서 먼저 티가 납니다. 마지막 날짜를 확인하세요.</p>
    <div class="tablewrap"><table id="data-table"></table></div>
  </section>
</main>

  const d=[0.0077846957090414622,0.32246712907003983,2.4451341117582518,3.7544086619074162];

  if(p<pl){const q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}

/* ---------- 갱신 버튼 ----------
   실행 환경이 셋이라 동작이 갈립니다.
     1) localhost + serve.py  : 진짜로 수집을 돌립니다
     2) GitHub Pages          : 깃허브 서버가 수집하므로, 수동 실행 페이지로 보냅니다
     3) 파일 직접 열기(file://): 아무것도 못 하므로 방법을 안내합니다             */
const host = location.hostname;
const isLocalServer = (location.protocol==='http:'||location.protocol==='https:') &&
                      (host==='localhost'||host==='127.0.0.1');
const REPO = (B.meta && B.meta.github_repo) || '';
const btn = document.getElementById('btn-refresh');
const msgBox = document.getElementById('refresh-msg');
function say(html, cls){ msgBox.innerHTML = html ? '<div class="'+(cls||'warn')+'">'+html+'</div>' : ''; }

if(!isLocalServer && REPO) btn.textContent = '지금 갱신 실행';

btn.onclick = async () => {
  if(!isLocalServer && REPO){
    window.open('https://github.com/'+REPO+'/actions/workflows/daily.yml','_blank','noopener');
    say('<b>깃허브 Actions 페이지를 열었습니다.</b><br>'+
        '오른쪽 <b>Run workflow</b> 버튼을 누르면 수집이 시작됩니다. 2~3분 뒤 이 페이지를 새로고침하세요.<br>'+
        '<span class="mini">평소에는 매일 06:30(KST)에 자동으로 돌기 때문에 누를 일이 거의 없습니다.</span>');
    return;
  }
  if(!isLocalServer){
    say('<b>이 화면에서는 갱신할 수 없습니다.</b><br>'+
        '브라우저 혼자서는 파이썬을 실행할 수 없습니다. 방법은 둘 중 하나입니다.<br>'+
        '① 내 PC에서 돌리기 — 프로젝트 폴더에서 <code>python serve.py</code><br>'+
        '② 깃허브에 올려서 자동화 — README의 「깃허브 자동화」 항목 참고');
    return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>수집 중';
  say('<b>수집 중입니다.</b> 종목 수에 따라 20~60초 걸립니다. 창을 닫지 마세요.');
  try{
    const r = await (await fetch('/api/refresh',{method:'POST'})).json();
    if(!r.started){ say(r.message||'이미 실행 중입니다.'); btn.disabled=false; btn.textContent='데이터 갱신'; return; }
    poll();
  }catch(e){
    say('<b>서버에 연결하지 못했습니다.</b> '+esc(e.message),'warn danger');
    btn.disabled=false; btn.textContent='데이터 갱신';
  }
};
async function poll(){
  try{
    const s = await (await fetch('/api/status')).json();
    if(s.running){ setTimeout(poll,1200); return; }
    if(s.ok){ say('<b>갱신 완료.</b> 화면을 다시 불러옵니다…','warn ok'); setTimeout(()=>location.reload(),700); }
    else{
      say('<b>갱신 실패.</b> '+esc(s.message)+'<br>티커가 바뀌었거나 네트워크 문제일 수 있습니다. 터미널 창의 로그를 확인하세요.','warn danger');
      btn.disabled=false; btn.textContent='데이터 갱신';
    }
  }catch(e){ setTimeout(poll,2000); }
}

/* ---------- 모델 평가 ---------- */
function evalModel(spec, opts){
  opts = opts || {};
  const rows = B.series[spec.id] || [];
  const la = opts.longAbove!=null ? opts.longAbove : spec.rule.long_above;
  const sb = opts.shortBelow!=null ? opts.shortBelow : spec.rule.short_below;
  const cost = (opts.costBps!=null ? opts.costBps : B.meta.cost_bps)/10000;
  const fade = spec.trade.direction === 'fade';
  const out = [];
  for(const row of rows){
    const s=row[1], u=row[2], live=row[3];
    if(opts.mode==='live' && !live) continue;
    if(opts.mode==='backtest' && live) continue;
    let p = s>=la ? 1 : (s<=sb ? -1 : 0);
    if(fade) p = -p;
    out.push({di:row[0],s:s,u:u,live:live,p:p,net:p*u-(p!==0?cost:0)});
  }
  return out;
}
function stats(rows){
  const t = rows.filter(r=>r.p!==0), n = t.length;
  if(!n) return {n:0,win:NaN,avg:NaN,total:0,sharpe:NaN,mdd:0,curve:[]};
  const rets = t.map(r=>r.net);
  const win = rets.filter(x=>x>0).length/n;
  const avg = rets.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(rets.reduce((a,b)=>a+Math.pow(b-avg,2),0)/Math.max(1,n-1));
  let eq=1,peak=1,mdd=0;
  const curve = t.map(r=>{eq*=(1+r.net);peak=Math.max(peak,eq);mdd=Math.min(mdd,eq/peak-1);return{di:r.di,eq:eq};});
  return {n:n,win:win,avg:avg,total:eq-1,sharpe:sd>0?avg/sd*Math.sqrt(252):NaN,mdd:mdd,curve:curve};
}
const noiseThreshold = (n,k) => (!n||n<2)?NaN:0.5+invNorm(1-0.05/Math.max(1,k))*0.5/Math.sqrt(n);

function similar(spec, sigval){
  const tol = Math.max(0.004, Math.abs(sigval)*0.25);
  return stats(evalModel(spec).filter(r =>
    Math.sign(r.s)===Math.sign(sigval) && Math.abs(r.s-sigval)<=tol && r.p!==0));
}
function eventsFor(dateStr, key){
  return (B.events||[]).filter(e =>
    dateStr >= e.from && dateStr <= (e.to||e.from) &&
    (!e.keys || !e.keys.length || e.keys.indexOf(key)>=0));
}

function renderRank(){
  document.getElementById('gloss').innerHTML =
    GLOSS.map(g=>'<div><dt>'+g[0]+'</dt><dd>'+g[1]+'</dd></div>').join('');

  const rows = B.models.map(m=>({m:m,st:stats(evalModel(m)),live:stats(evalModel(m,{mode:'live'}))}))
    .sort((a,b)=>(isNaN(b.st.win)?-1:b.st.win)-(isNaN(a.st.win)?-1:a.st.win));

  const coin = rows.filter(r=>r.m.id==='M008')[0];
  const ns = rows.filter(r=>r.st.n>=30).map(r=>r.st.n).sort((a,b)=>a-b);
  const medN = ns.length ? ns[Math.floor(ns.length/2)] : 0;
  const thr = noiseThreshold(medN, B.models.length);
  const best = rows.filter(r=>r.st.n>=30)[0];
  const liveN = rows.reduce((a,r)=>a+r.live.n,0);

  let banner = '';
  if(liveN===0){
    banner += '<div class="warn danger"><b>사전기록 표본 0건.</b> 아래 성적은 전부 과거 재현입니다. '+
      '결과를 이미 아는 구간에서 나온 숫자라 <b>증거가 아닙니다.</b> 매일 갱신해서 30건 이상 쌓인 뒤 판단하세요.</div>';
  }
  if(medN && best){
    const ok = best.st.win > thr;
    banner += '<div class="warn '+(ok?'':'danger')+'"><b>노이즈 기준선 '+pct(thr)+'</b> — '+
      '모델 '+B.models.length+'개를 표본 '+medN+'건으로 돌리면 전부 동전던지기여도 최고 승률이 이 정도는 나옵니다. '+
      '현재 1위 '+esc(best.m.id)+' <b>'+pct(best.st.win)+'</b>. '+
      (ok ? '기준선을 넘었습니다. 사전기록으로 재확인이 필요합니다.'
          : '기준선 미달 → <b>아직 아무것도 발견하지 못했습니다.</b>')+'</div>';
  }
  if(coin && coin.st.n>=30){
    banner += '<div class="warn">동전던지기 모델(M008) 승률 <b>'+pct(coin.st.win)+'</b>. '+
      '비용 '+B.meta.cost_bps+'bps를 빼면 근거 없는 매매의 기대 승률은 50%가 아니라 이 값입니다. '+
      '<b>이보다 낮은 모델은 폐기하세요.</b></div>';
  }
  document.getElementById('noise-banner').innerHTML = banner;

  document.getElementById('rank-table').innerHTML =
    '<thead><tr><th class="l">모델</th><th>진입</th><th>승률</th><th>평균수익</th>'+
    '<th>누적</th><th>샤프</th><th>MDD</th><th>사전기록</th></tr></thead><tbody>'+
    rows.map(o=>{
      const st=o.st, thin=st.n<30, w=isNaN(st.win)?0:st.win;
      return '<tr class="clk '+(thin?'dim':'')+'" data-id="'+o.m.id+'">'+
        '<td class="l"><b>'+o.m.id+'</b> '+esc(o.m.name)+
          (o.m.executable===false?'<span class="tag ref">측정전용</span>':'')+
          (thin?'<span class="tag stop">표본부족</span>':'')+'</td>'+
        '<td class="num">'+st.n+'</td>'+
        '<td class="num"><span class="bar" style="width:'+(w*46).toFixed(0)+'px"></span>'+(isNaN(st.win)?'—':pct(st.win))+'</td>'+
        '<td class="num '+sgn(st.avg)+'">'+(isNaN(st.avg)?'—':pct(st.avg,2))+'</td>'+
        '<td class="num '+sgn(st.total)+'">'+pct(st.total,1)+'</td>'+
        '<td class="num">'+(isNaN(st.sharpe)?'—':st.sharpe.toFixed(2))+'</td>'+
        '<td class="num neg">'+pct(st.mdd,1)+'</td>'+
        '<td class="num">'+(o.live.n||'<span style="color:var(--flat)">0</span>')+'</td></tr>';
    }).join('')+'</tbody>';

  Array.prototype.forEach.call(document.querySelectorAll('#rank-table tr[data-id]'), tr =>
    tr.onclick = () => { document.getElementById('msel').value = tr.dataset.id; tab('detail'); renderDetail(); });
}

function renderDetail(){
  const m = B.models.filter(x=>x.id===document.getElementById('msel').value)[0];
  const el = document.getElementById('detail-body');
  if(!m){ el.innerHTML='<div class="card empty">모델을 선택하세요.</div>'; return; }

  const la = parseFloat(el.dataset.la!=null?el.dataset.la:m.rule.long_above);
  const sb = parseFloat(el.dataset.sb!=null?el.dataset.sb:m.rule.short_below);
  const cb = parseFloat(el.dataset.cb!=null?el.dataset.cb:B.meta.cost_bps);
  const all  = stats(evalModel(m,{longAbove:la,shortBelow:sb,costBps:cb}));
  const live = stats(evalModel(m,{longAbove:la,shortBelow:sb,costBps:cb,mode:'live'}));
  const thr  = noiseThreshold(all.n, B.models.length);

  const card = (title,st,warn) => '<div class="card"><h2>'+title+'</h2>'+
    '<p class="hint" style="margin:2px 0 0">'+warn+'</p><div class="stats">'+
    '<div class="stat"><div class="k">진입</div><div class="v">'+st.n+'</div></div>'+
    '<div class="stat"><div class="k">승률</div><div class="v">'+(isNaN(st.win)?'—':pct(st.win))+'</div></div>'+
    '<div class="stat"><div class="k">평균수익</div><div class="v '+sgn(st.avg)+'">'+(isNaN(st.avg)?'—':pct(st.avg,2))+'</div></div>'+
    '<div class="stat"><div class="k">누적</div><div class="v '+sgn(st.total)+'">'+pct(st.total,1)+'</div></div></div></div>';

  el.innerHTML =
    '<div class="card" style="margin-bottom:12px"><div style="font-size:13px;line-height:1.75">'+
      '<b style="color:var(--dawn)">가설</b> · '+esc(m.hypothesis)+'<br>'+
      '<b style="color:var(--dawn)">구조</b> · '+esc(LB(m.signal.key))+'의 '+
        esc(FIELDNAME[m.signal.field]||m.signal.field)+'이 신호 → '+esc(LB(m.trade.key))+'를 '+
        esc(m.trade.entry)+'에 진입, '+esc(m.trade.exit)+'에 청산 ('+(m.trade.direction==='fade'?'역방향':'순방향')+')<br>'+
      '<b style="color:var(--dawn)">등록일</b> · '+esc(m.created_at)+
        ' <span class="mini">(이 날 이후만 진짜 증거)</span></div>'+
      (m.note?'<div class="note">'+esc(m.note)+'</div>':'')+'</div>'+
    '<div class="card sliders" style="margin-bottom:12px">'+
      '<div class="slider"><label>롱 임계값 <span>'+(la*100).toFixed(1)+'%</span></label>'+
        '<input type="range" id="s-la" min="0" max="5" step="0.1" value="'+(la*100).toFixed(1)+'"></div>'+
      '<div class="slider"><label>숏 임계값 <span>'+(sb*100).toFixed(1)+'%</span></label>'+
        '<input type="range" id="s-sb" min="-5" max="0" step="0.1" value="'+(sb*100).toFixed(1)+'"></div>'+
      '<div class="slider"><label>왕복 거래비용 <span>'+cb.toFixed(0)+'bps</span></label>'+
        '<input type="range" id="s-cb" min="0" max="80" step="5" value="'+cb+'"></div></div>'+
    '<div class="split" style="margin-bottom:12px">'+
      card('과거 재현 (백테스트)', all, '결과를 아는 구간. 참고용입니다. 노이즈 기준선 '+(isNaN(thr)?'—':pct(thr)))+
      card('사전 기록 (실전)', live, live.n===0
        ? '아직 0건. 30건을 넘기 전까지 이 모델을 신뢰하지 마세요.'
        : '결과 나오기 전에 적어둔 예측. 이것만이 진짜 성적입니다.')+
    '</div><div class="chart"><svg id="eq" viewBox="0 0 800 220" preserveAspectRatio="none"></svg></div>';

  ['la','sb','cb'].forEach(k => document.getElementById('s-'+k).oninput = e => {
    el.dataset[k] = (k==='cb') ? e.target.value : String(parseFloat(e.target.value)/100);
    renderDetail();
  });
  drawEquity(all.curve);
}

function drawEquity(curve){
  const svg = document.getElementById('eq');
  if(!svg) return;
  if(curve.length<2){
    svg.innerHTML='<text x="400" y="110" fill="#5C6784" font-size="13" text-anchor="middle" font-family="Pretendard">누적 곡선을 그릴 표본이 부족합니다</text>';
    return;
  }
  const W=800,H=220,P=26, ys=curve.map(c=>c.eq);
  const lo=Math.min.apply(null,[1].concat(ys)), hi=Math.max.apply(null,[1].concat(ys)), span=(hi-lo)||1;
  const X=i=>P+i/(curve.length-1)*(W-2*P), Y=v=>H-P-(v-lo)/span*(H-2*P);
  const path=curve.map((c,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(c.eq).toFixed(1)).join('');
  const end=ys[ys.length-1], col=end>=1?'#FF5C5C':'#4D96FF';
  svg.innerHTML='<line x1="'+P+'" y1="'+Y(1)+'" x2="'+(W-P)+'" y2="'+Y(1)+'" stroke="#263252" stroke-dasharray="3 4"/>'+
    '<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round"/>'+
    '<text x="'+P+'" y="16" fill="#7E8AA8" font-size="11" font-family="JetBrains Mono">누적 자본 (시작 1.00)</text>'+
    '<text x="'+(W-P)+'" y="16" fill="'+col+'" font-size="12" text-anchor="end" font-family="JetBrains Mono">'+end.toFixed(3)+'</text>';
}

/* ---------- 데이터 현황 ---------- */
function renderData(){
  const now = new Date();
  document.getElementById('data-table').innerHTML =
    '<thead><tr><th class="l">종목</th><th>일수</th><th>시작</th><th>마지막</th><th>종가</th></tr></thead><tbody>'+
    B.universe.map(u=>{
      const days=Math.floor((now-new Date(u.last))/86400000), stale=days>5;
      return '<tr class="'+(stale?'dim':'')+'"><td class="l"><b>'+esc(LB(u.key))+'</b> '+
        '<span style="color:var(--mute);font-family:var(--mono);font-size:11px">'+esc(u.key)+'</span></td>'+
        '<td class="num">'+u.n+'</td><td class="num">'+esc(u.first)+'</td>'+
        '<td class="num">'+esc(u.last)+(stale?'<span class="tag stop">지연</span>':'')+'</td>'+
        '<td class="num">'+u.last_close.toLocaleString()+'</td></tr>';
    }).join('')+'</tbody>';
}

/* ---------- 탭 / 초기화 ---------- */
function tab(name){
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),
    b=>b.setAttribute('aria-selected', b.dataset.t===name));
  ['today','rank','detail','data'].forEach(t=>document.getElementById('p-'+t).hidden=(t!==name));
}
Array.prototype.forEach.call(document.querySelectorAll('nav button'), b => b.onclick = () => {
  tab(b.dataset.t); if(b.dataset.t==='detail') renderDetail();
});
function nowMarker(){
  const kst = new Date(Date.now()+new Date().getTimezoneOffset()*60000+9*3600000);
  const x = (kst.getHours()*60+kst.getMinutes())/1440*1000;
  const l=document.getElementById('nowline'), d=document.getElementById('nowdot');
  if(l){ l.setAttribute('x1',x); l.setAttribute('x2',x); d.setAttribute('cx',x); }
}

document.getElementById('msel').innerHTML =
  B.models.map(m=>'<option value="'+m.id+'">'+m.id+' · '+esc(m.name)+'</option>').join('');
document.getElementById('msel').onchange = () => {
  const el=document.getElementById('detail-body');
  delete el.dataset.la; delete el.dataset.sb; delete el.dataset.cb;
  renderDetail();
};

renderBoard(); renderToday(); renderRank(); renderData(); nowMarker();
setInterval(nowMarker, 60000);

(function initStamp(){
  const gen = B.meta.generated_at || '';
  const t = gen ? new Date(gen.replace(' ','T')) : null;
  const age = t ? Math.floor((Date.now()-t.getTime())/3600000) : null;
  const stale = age!==null && age>=24;
  document.getElementById('stamp').innerHTML =
    '<span class="'+(stale?'stale':'')+'">갱신 '+esc(gen)+(age!==null?' ('+age+'시간 전)':'')+'</span><br>'+
    esc(B.meta.range[0])+' ~ '+esc(B.meta.range[1])+' · '+B.meta.n_days+'일 · 비용 '+B.meta.cost_bps+'bps';
  if(stale) say('<b>데이터가 '+age+'시간 전 것입니다.</b> 오늘 기준으로 보려면 상단 <b>데이터 갱신</b>을 눌러주세요.');
})();
</script>
